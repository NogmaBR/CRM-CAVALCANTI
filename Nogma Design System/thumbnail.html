<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{ margin:0; }
  .tile{ width:1280px; height:854px; display:flex; overflow:hidden; }
  .main{ flex:1; background:var(--petroleum-800); display:flex; align-items:center; justify-content:center; }
  .main img{ width:62%; height:auto; }
  .strip{ width:150px; display:flex; flex-direction:column; }
  .strip span{ flex:1; }
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logo-nogma-lime.png" alt="Nogma"></div>
  <div class="strip">
    <span style="background:#CCFF00"></span>
    <span style="background:#E8A317"></span>
    <span style="background:#2FA36B"></span>
    <span style="background:#D6483B"></span>
  </div>
</div>
</body>
</html>
