<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;}
  .row{display:flex;gap:20px;align-items:center;}
  .tile{width:96px;height:96px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-subtle);}
  .tile img{width:52px;height:auto;}
  .app{width:96px;height:96px;border-radius:22px;}
  .fav{width:44px;height:44px;border-radius:10px;}
  .note{margin-left:auto;max-width:230px;font-size:13px;color:var(--text-secondary);line-height:1.5;}
  .note b{color:var(--text-primary);}
</style></head>
<body>
  <div class="row">
    <div class="tile" style="background:#0C4651"><img src="../assets/isotype-n-lime.png" alt="n"></div>
    <div class="tile app" style="background:#CCFF00"><img src="../assets/isotype-n-petroleum.png" alt="n"></div>
    <div class="tile fav" style="background:#0C4651"><img src="../assets/isotype-n-lime.png" alt="n" style="width:24px"></div>
    <div class="note"><b>Uso restrito.</b> Só quando a marca já está consolidada. Sem gradientes. Nunca sobre fundos que comprometam a legibilidade.</div>
  </div>
</body></html>
