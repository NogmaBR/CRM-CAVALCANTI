<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);background:#fff;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr) repeat(2,1fr);gap:12px;}
  .cell{height:74px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:26px;position:relative;overflow:hidden;}
  .tag{position:absolute;top:6px;right:8px;font-family:var(--font-sans);font-size:14px;font-weight:800;}
  .ok{color:#2FA36B;} .no{color:#D6483B;}
  .cap{margin-top:10px;font-size:12px;color:var(--text-muted);}
  .bad{opacity:.9;}
</style></head>
<body>
  <div class="grid">
    <div class="cell" style="background:#fff;color:#0C4651;border:1px solid var(--border-subtle)">nogma<span class="tag ok">✓</span></div>
    <div class="cell" style="background:#0C4651;color:#CCFF00">nogma<span class="tag ok">✓</span></div>
    <div class="cell" style="background:#CCFF00;color:#000">nogma<span class="tag ok">✓</span></div>
    <div class="cell bad" style="background:#A1A1A1;color:#CCFF00">nogma<span class="tag no">✕</span></div>
    <div class="cell bad" style="background:linear-gradient(90deg,#7b3ff2,#2f80ed);color:#0C4651">nogma<span class="tag no">✕</span></div>
  </div>
  <div class="cap">✓ petróleo/branco/lime entre si · preto sobre lime &nbsp;&nbsp;•&nbsp;&nbsp; ✕ cinza médio, fundos vibrantes, gradientes na marca</div>
</body></html>
