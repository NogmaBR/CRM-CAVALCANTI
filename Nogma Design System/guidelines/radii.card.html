<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:20px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:64px;height:52px;background:var(--petroleum-050);border:1.5px solid var(--petroleum-800);}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="n">xs · 4</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="n">sm · 6</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="n">md · 10</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="n">lg · 14</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="n">xl · 20</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="n">pill</div></div>
  </div>
</body></html>
