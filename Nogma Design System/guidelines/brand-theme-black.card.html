<!-- @dsCard group="Brand" viewport="700x220" name="Tema preto — primário" subtitle="Fundo preto · títulos em lime · texto em branco" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:32px;background:#000;font-family:var(--font-sans);}
  .on-black h2{ font-size:34px; letter-spacing:-.02em; margin:0; }
  .on-black p{ font-size:15.5px; line-height:1.6; color:var(--text-secondary); margin:14px 0 0; max-width:460px; }
  .eyebrow{ font-family:var(--font-display); font-weight:700; letter-spacing:.16em; text-transform:uppercase; font-size:12px; color:var(--lime-500); }
  .row{ display:flex; gap:10px; margin-top:22px; align-items:center; }
  .btn{ height:44px; padding:0 20px; border-radius:var(--radius-md); border:none; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .btn--lime{ background:var(--lime-500); color:#000; }
  .btn--ghost{ background:transparent; color:#fff; border:1.5px solid var(--border-default); }
  .chip{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--neutral-400); }
</style></head>
<body class="on-black">
  <div class="eyebrow">Automação &amp; IA</div>
  <h2>Menos operação manual. Mais resultado.</h2>
  <p>Fundo preto como base. Títulos em <b style="color:var(--lime-500)">lime</b>, texto corrido em branco. Lime segue sendo destaque — nunca blocos longos de texto.</p>
  <div class="row">
    <button class="btn btn--lime">Agendar diagnóstico</button>
    <button class="btn btn--ghost">Ver como funciona</button>
    <span class="chip">.on-black</span>
  </div>
</body></html>
