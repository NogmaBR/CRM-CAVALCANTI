<!-- @dsCard group="Colors" viewport="700x188" name="Primárias" subtitle="Verde petróleo (base) + Lime (accent)" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:16px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle);}
  .chip{height:96px;display:flex;align-items:flex-end;padding:12px;}
  .meta{padding:10px 12px;}
  .name{font-weight:800;font-size:15px;letter-spacing:-.01em;}
  .hex{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}
  .use{font-size:12px;color:var(--text-secondary);margin-top:6px;}
</style></head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#0C4651;color:#CCFF00;font-weight:800;font-family:var(--font-display);font-size:20px">Aa</div>
      <div class="meta"><div class="name">Verde petróleo</div><div class="hex">#0C4651</div><div class="use">Base escura · superfícies · texto forte</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#CCFF00;color:#0C4651;font-weight:800;font-family:var(--font-display);font-size:20px">Aa</div>
      <div class="meta"><div class="name">Lime</div><div class="hex">#CCFF00</div><div class="use">Accent / destaque · nunca texto longo</div></div>
    </div>
  </div>
</body></html>
