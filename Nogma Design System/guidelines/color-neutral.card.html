<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
  .row{display:flex;gap:16px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle);}
  .chip{height:96px;}
  .meta{padding:10px 12px;}
  .name{font-weight:800;font-size:15px;letter-spacing:-.01em;}
  .hex{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}
  .use{font-size:12px;color:var(--text-secondary);margin-top:6px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#000000"></div><div class="meta"><div class="name">Preto</div><div class="hex">#000000</div><div class="use">Texto sobre lime · contraste</div></div></div>
    <div class="sw"><div class="chip" style="background:#A1A1A1"></div><div class="meta"><div class="name">Cinza</div><div class="hex">#A1A1A1</div><div class="use">Secundário · legendas · bordas</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--border-subtle)"></div><div class="meta"><div class="name">Branco</div><div class="hex">#FFFFFF</div><div class="use">Base clara · texto sobre petróleo</div></div></div>
  </div>
</body></html>
