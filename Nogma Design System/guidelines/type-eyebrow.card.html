<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .eyebrow{font-family:var(--font-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:var(--petroleum-600);}
  .stat{font-family:var(--font-display);font-weight:700;font-size:52px;letter-spacing:-.02em;line-height:1;margin-top:6px;}
  .stat b{color:#0C4651;}
  .row{display:flex;gap:40px;align-items:flex-end;}
  .cap{font-size:12px;color:var(--text-muted);margin-top:8px;}
</style></head>
<body>
  <div class="eyebrow">Automação &amp; IA</div>
  <div class="row">
    <div><div class="stat"><b>128h</b></div><div class="cap">economizadas / mês</div></div>
    <div><div class="stat"><b>+42%</b></div><div class="cap">produtividade</div></div>
  </div>
</body></html>
