<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
  .ramp{display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle);}
  .c{flex:1;height:66px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;}
  .lbl{display:flex;margin-top:8px;}
  .lbl span{flex:1;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
</style></head>
<body>
  <div class="ramp">
    <div class="c" style="background:#041F25;color:#fff">950</div>
    <div class="c" style="background:#072C34;color:#fff">900</div>
    <div class="c" style="background:#0C4651;color:#fff">800</div>
    <div class="c" style="background:#115965;color:#fff">700</div>
    <div class="c" style="background:#196E7C;color:#fff">600</div>
    <div class="c" style="background:#2A8797;color:#fff">500</div>
    <div class="c" style="background:#7FB9C3;color:#04222a">300</div>
    <div class="c" style="background:#B4D7DD;color:#04222a">200</div>
    <div class="c" style="background:#E1EEF0;color:#04222a">100</div>
    <div class="c" style="background:#F1F7F8;color:#04222a">050</div>
  </div>
</body></html>
