<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:26px 22px;background:var(--neutral-50);font-family:var(--font-sans);}
  .row{display:flex;gap:26px;align-items:center;}
  .item{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .box{width:84px;height:56px;background:#fff;border-radius:var(--radius-md);}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lime)"></div><div class="n">lime glow</div></div>
  </div>
</body></html>
