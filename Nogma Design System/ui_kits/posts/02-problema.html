<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="_sys.css">
<style>
  /* fundo próprio: constelação + glows recentrados (variação, não o mesmo grid) */
  .bg .glow-lime{top:-360px; left:50%; transform:translateX(-50%); width:1000px; opacity:.9;}
  .bg .glow-teal{right:auto; left:50%; transform:translateX(-50%); bottom:-260px; width:900px;}
  /* continuação da emenda que vem da capa: MESMO width+top do slide 1; left = 540 − 1080. */
  .bg .stroke{width:1640px; top:-260px; left:-623px; opacity:.42;}

  .content{display:flex; flex-direction:column;}
  .mid{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:0;}
  .eyebrow{justify-content:center; margin-top:0;}
  .h1{font-size:66px; max-width:860px; margin-top:30px;}
  .st-sub{font-size:29px; line-height:1.5; color:var(--ink-2); margin-top:26px; max-width:720px;}
  .st-sub b{color:#fff; font-weight:var(--fw-bold);}
  .rule{width:60px; height:4px; background:var(--lime-500); border-radius:3px; margin:44px 0 40px;
    box-shadow:0 0 22px color-mix(in srgb,var(--lime-500) 55%,transparent);}
  .punch{font-family:var(--heading-family); font-weight:var(--fw-extrabold);
    font-size:42px; line-height:1.14; letter-spacing:-.02em; color:#fff; max-width:860px;}
  .punch .lm{color:var(--lime-500);}
</style>
</head>
<body class="on-black">
  <div class="slide">
    <div class="bg">
      <div class="dots"></div>
      <div class="glow-lime"></div>
      <div class="glow-teal"></div>
      <img class="stroke" src="../../assets/intersecoes/10.png" alt="">
    </div>

    <div class="content">
      <header class="top">
        <img class="wordmark" src="../../assets/logo-nogma-lime.png" alt="nogma">
        <span class="counter">02 / 07</span>
      </header>

      <main class="mid">
        <div class="eyebrow sq">O problema real</div>
        <h1 class="h1">O difícil não é achar<br>o que <span class="lm">automatizar</span>.</h1>
        <p class="st-sub">É que <b>tudo parece importante</b> ao mesmo tempo.</p>
        <div class="rule"></div>
        <p class="punch">E quando tudo parece prioridade,<br>a escolha acaba sendo <span class="lm">por intuição</span>.</p>
      </main>

      <footer class="foot">
        <span class="site">nogma.br</span>
        <span class="drag">→</span>
      </footer>
    </div>
  </div>
</body>
</html>
